name: Actualización diaria de precios

on:
  schedule:
    # 09:00 hora Colombia (UTC-5) = 14:00 UTC. Ajusta si prefieres otra hora.
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña Actions

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para poder commitear providers_auto.yaml actualizado
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descubrir proveedores nuevos (candidates.txt)
        run: python -m src.discover

      - name: Ejecutar actualización de precios
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: python -m src.main

      - name: Guardar proveedores auto-descubiertos nuevos (si los hay)
        run: |
          if [ -n "$(git status --porcelain config/providers_auto.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config/providers_auto.yaml
            git commit -m "chore: actualizar proveedores auto-descubiertos"
            git push
          else
            echo "Sin cambios en providers_auto.yaml"
          fi

# Configuración requerida una sola vez en GitHub:
# Settings -> Secrets and variables -> Actions -> New repository secret
#   PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# (los datos de tu servidor PostgreSQL ya existente)
