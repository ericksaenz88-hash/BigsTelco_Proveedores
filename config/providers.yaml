# ============================================================================
# MATRIZ DE PROVEEDORES
#
# Esta es la lista viva de proveedores a monitorear — proveedores grandes y
# pequeños conviven aquí. Para agregar uno nuevo cuando aparezca en el
# mercado, se agrega un bloque más abajo; el orquestador (src/main.py) los
# recorre a todos automáticamente, sin que haya que tocar código.
#
# Cada proveedor declara un "adapter" (cómo se le habla):
#
#   - adapter: css
#       Para sitios que renderizan el catálogo en el servidor (no usan
#       JavaScript para mostrar productos). Se configuran "selectors" CSS.
#       Es el camino por defecto para proveedores nuevos y pequeños.
#
#   - adapter: gvs_api / syscom_algolia
#       Adaptadores a medida para proveedores grandes que sí requieren
#       JavaScript en el navegador, pero cuya API interna se identificó y
#       se puede consumir directamente (más rápido y estable que un
#       navegador headless). Ver src/adapters/gvs_api.py y
#       src/adapters/syscom_algolia.py para el detalle de cómo se
#       encontraron y qué hacen.
#
# Cómo añadir un proveedor nuevo (caso típico, sitio simple):
#   1. Abre la página de listado de productos en el navegador.
#   2. Con "Inspeccionar elemento" identifica los selectores CSS.
#   3. Copia un bloque de "adapter: css" abajo y ajusta selectors/categories.
#   4. Prueba: python -m src.main --provider tu_codigo --dry-run
#   5. Si funciona, pon active: true.
#
# Cómo añadir un proveedor grande con su propia API/JS (caso GVS/SYSCOM):
#   1. Investiga con las herramientas de red del navegador (pestaña
#      Network) qué llamadas hace el sitio para cargar productos.
#   2. Si encuentras una API JSON pública (search-only key, REST, etc.),
#      escribe un adaptador nuevo en src/adapters/tu_proveedor.py con una
#      función fetch(provider_cfg) -> list[ScrapedProduct].
#   3. Regístralo en src/adapters/__init__.py (diccionario ADAPTERS).
#   4. Agrega el bloque aquí con adapter: tu_proveedor.
#
# IMPORTANTE: revisa siempre los Términos de Uso / robots.txt del sitio
# antes de activar el scraping automático (ver README, "Aspectos legales").
# ============================================================================

providers:

  # --------------------------------------------------------------------
  # PROVEEDORES GRANDES (adaptadores a medida, API interna)
  # --------------------------------------------------------------------

  - code: gvs
    name: "GVS Colombia"
    sector: "seguridad_electronica_cableado_redes"
    base_url: "https://www.gvscolombia.com"
    active: true
    adapter: gvs_api
    notes: >
      Catálogo completo (todas las líneas: CCTV, Cableado, Control de
      Acceso, Redes, etc.) vía la API interna de GVS. Se auto-descubre la
      lista de líneas en cada corrida (POST /lineasv2), así que categorías
      nuevas que GVS agregue se recogen automáticamente sin editar este
      archivo. Precio usado: PrecioFinal (incluye descuentos vigentes).

  - code: syscom
    name: "SYSCOM Colombia"
    sector: "seguridad_electronica_cableado_redes_radiocomunicacion"
    base_url: "https://www.syscomcolombia.com"
    active: true
    adapter: syscom_algolia
    notes: >
      Catálogo completo vía la API pública de búsqueda (Algolia) que usa
      el sitio. Se auto-descubren las categorías de primer nivel
      (facet menu_1: Cableado Estructurado, Videovigilancia, Redes,
      Radiocomunicación, Energía, etc.) en cada corrida. Solo se guardan
      productos con mostrar_precio=true (los que el sitio expone sin
      necesidad de iniciar sesión).

